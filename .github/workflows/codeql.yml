name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "45 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@9f759ee644a3e7c15c1390abf49868036c00067b # v3

      - name: Upload CodeQL results
        uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          category: "/language:rust"
